workflows:
  ios-capacitor-build:
    name: Build iOS Capacitor Alarm App v1.4
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add iOS platform and sync web assets
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Bundle 18-second WAV alarm ringtones into iOS App target & enable background audio
        script: |
          ruby -e '
            require "xcodeproj"
            project_path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.find { |t| t.name == "App" }
            group = project.main_group.find_subpath("App", true)
            
            Dir.glob("www/sounds/*.wav").each do |wav|
              fname = File.basename(wav)
              dest = "ios/App/App/#{fname}"
              FileUtils.cp(wav, dest)
              existing = group.files.find { |f| f.path == fname }
              unless existing
                file_ref = group.new_reference(fname)
                target.resources_build_phase.add_file_reference(file_ref)
              end
            end
            project.save
          '
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/App/App/Info.plist || true
      - name: Build unsigned iOS app (for Sideloadly)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r ../../../NhacNhoPlus-v1.4-unsigned.ipa Payload
    artifacts:
      - NhacNhoPlus-v1.4-unsigned.ipa
