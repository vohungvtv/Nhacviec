<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NhắcNhở+" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>NhắcNhở+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    @keyframes ringShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-18deg) scale(1.08); }
      40% { transform: rotate(18deg) scale(1.08); }
      60% { transform: rotate(-12deg) scale(1.05); }
      80% { transform: rotate(12deg) scale(1.05); }
    }
    .animate-ring { animation: ringShake 0.45s infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col max-w-md mx-auto relative">

  <!-- Header -->
  <header class="px-5 pt-6 pb-4 flex items-center justify-between border-b border-slate-800/80 bg-slate-950/90 sticky top-0 z-10 backdrop-blur">
    <div>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">NhắcNhở+</h1>
      <p id="todayDate" class="text-xs text-slate-400 mt-0.5"></p>
    </div>

    <!-- Công tắc Bật / Tắt Báo thức tổng thể (Mặc định luôn BẬT) -->
    <button onclick="toggleMasterAlarm()" id="masterAlarmBtn" class="px-3.5 py-2 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/35 active:scale-95 transition flex items-center gap-1.5">
      <span id="masterAlarmDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="masterAlarmLabel">Báo thức: BẬT</span>
    </button>
  </header>

  <!-- Banner trạng thái động (Tự động đổi màu khi Bật hoặc Tắt báo thức) -->
  <div id="statusBanner" class="mx-4 mt-3 px-3.5 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/25 flex items-center gap-2.5 text-xs text-amber-200/90 transition-all">
    <span id="statusBannerIcon" class="text-base">🔊</span>
    <span id="statusBannerText">Chế độ <b>Báo thức đang BẬT</b>: Chuông đổ ầm ĩ 18 giây + rung mạnh kể cả khi tắt app (nhớ bật chuông bên hông iPhone).</span>
  </div>

  <!-- Danh sách công việc -->
  <main class="flex-1 px-4 py-4 pb-28 overflow-y-auto space-y-3" id="taskList">
    <!-- Render bằng JS từ IndexedDB -->
  </main>

  <!-- Nút Thêm nhanh -->
  <div class="fixed bottom-6 inset-x-0 max-w-md mx-auto px-5 z-20">
    <button onclick="openModal()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 font-semibold text-white shadow-lg shadow-blue-600/30 active:scale-95 transition flex items-center justify-center gap-2 text-base">
      <span class="text-xl leading-none">+</span> Thêm lịch báo thức mới
    </button>
  </div>

  <!-- Modal Thêm việc -->
  <div id="addModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-30 hidden items-end sm:items-center justify-center">
    <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 border-t sm:border border-slate-800 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">Tạo báo thức nhắc việc</h2>
        <button onclick="closeModal()" class="text-slate-400 text-2xl leading-none">&times;</button>
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1">Nội dung công việc</label>
        <input type="text" id="taskTitle" placeholder="VD: Họp giao ban lúc 9h..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1">Thời gian báo thức</label>
        <input type="datetime-local" id="taskTime" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" />
        <div class="flex gap-2 mt-2 overflow-x-auto pb-1">
          <button type="button" onclick="quickTime(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-cyan-400 whitespace-nowrap">+1 phút (Test)</button>
          <button type="button" onclick="quickTime(15)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-slate-300 whitespace-nowrap">+15 phút</button>
          <button type="button" onclick="quickTime(60)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-slate-300 whitespace-nowrap">+1 giờ</button>
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1">Nhạc chuông báo thức (Kêu ầm ĩ 18 giây)</label>
        <div class="flex gap-2">
          <select id="taskSound" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 text-white text-sm focus:outline-none">
            <option value="urgent">🚨 Còi báo động khẩn cấp (To nhất)</option>
            <option value="classic">⏰ Chuông báo thức cổ điển</option>
            <option value="chime">🔔 Chuông ngân vang dội</option>
            <option value="nature">🐦 Chim hót rộn ràng</option>
          </select>
          <button type="button" onclick="previewSound()" id="previewBtn" class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm font-medium text-amber-400 active:scale-95">
            ▶ Thử
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between bg-slate-800/60 px-3.5 py-2.5 rounded-xl border border-slate-700/60">
        <div>
          <p class="text-xs font-medium text-slate-200">Nhắc dồn dập (3 hồi liên tiếp)</p>
          <p class="text-[11px] text-slate-400">Gửi 3 chuỗi chuông cách nhau 20 giây nếu chưa tắt</p>
        </div>
        <input type="checkbox" id="taskPersistent" checked class="w-5 h-5 accent-blue-500" />
      </div>

      <button onclick="saveTask()" class="w-full py-3.5 rounded-xl bg-blue-600 font-semibold text-white active:scale-95 transition mt-2">
        Đặt báo thức ngay
      </button>
    </div>
  </div>

  <!-- Màn hình Báo thức toàn màn hình khi đến giờ -->
  <div id="alarmOverlay" class="fixed inset-0 bg-gradient-to-b from-rose-950 via-slate-950 to-slate-950 z-50 hidden flex-col items-center justify-between p-8 text-center">
    <div class="mt-12">
      <div class="w-28 h-28 rounded-full bg-rose-500/20 border-2 border-rose-400/50 flex items-center justify-center mx-auto mb-6 animate-ring shadow-2xl shadow-rose-600/30">
        <span class="text-6xl">🚨</span>
      </div>
      <p class="text-rose-400 uppercase tracking-widest text-xs font-bold mb-2">BÁO THỨC ĐẾN GIỜ</p>
      <h2 id="alarmTitle" class="text-2xl font-bold text-white px-4"></h2>
      <p id="alarmTimeText" class="text-slate-400 text-sm mt-2"></p>
    </div>

    <div class="w-full space-y-3 mb-8">
      <button onclick="completeAlarmTask()" class="w-full py-4 rounded-2xl bg-emerald-500 text-slate-950 font-bold text-lg shadow-lg shadow-emerald-500/30 active:scale-95 transition">
        ✓ Tắt chuông & Hoàn thành
      </button>
      <button onclick="snoozeAlarmTask()" class="w-full py-3.5 rounded-2xl bg-slate-800 text-slate-200 font-medium active:scale-95 transition">
        💤 Báo lại sau 5 phút
      </button>
    </div>
  </div>

  <script>
    const DB_NAME = 'NhacNhoPlusDB_v2';
    const STORE_NAME = 'tasks';
    const MASTER_ALARM_KEY = 'nhacnho_master_alarm_enabled';
    let db = null;
    let tasks = [];
    let activeAlarmTask = null;
    let alarmAudioPlayer = null;
    let previewAudioPlayer = null;
    let vibrateInterval = null;

    // Mặc định của app là BẬT báo thức (true) nếu chưa từng tắt
    let isMasterAlarmOn = localStorage.getItem(MASTER_ALARM_KEY) !== 'false';

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function loadTasksFromDB() {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          tasks = (req.result || []).sort((a, b) => a.time - b.time);
          renderTasks();
          resolve(tasks);
        };
      });
    }

    async function saveTaskToDB(task) {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(task);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteTaskFromDB(id) {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function previewSound() {
      const sound = document.getElementById('taskSound').value;
      const btn = document.getElementById('previewBtn');
      if (previewAudioPlayer) {
        previewAudioPlayer.pause();
        previewAudioPlayer = null;
        btn.textContent = '▶ Thử';
        return;
      }
      previewAudioPlayer = new Audio(`sounds/${sound}.wav`);
      previewAudioPlayer.play();
      btn.textContent = '⏹ Dừng';
      setTimeout(() => {
        if (previewAudioPlayer) {
          previewAudioPlayer.pause();
          previewAudioPlayer = null;
          btn.textContent = '▶ Thử';
        }
      }, 4000);
    }

    function getBaseNotifId(taskId) {
      return Math.floor((taskId % 100000000) * 10);
    }

    async function scheduleNativeNotification(task) {
      // Chỉ nạp lịch báo thức vào iOS khi công tắc tổng đang BẬT và việc chưa hoàn thành
      if (!isMasterAlarmOn || task.done || task.time <= Date.now()) return;

      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        const baseId = getBaseNotifId(task.id);
        const soundFile = `${task.sound}.wav`;
        const notifications = [
          {
            id: baseId + 1,
            title: '🚨 BÁO THỨC: ' + task.title,
            body: 'Nhấn để mở ứng dụng và tắt chuông!',
            schedule: { at: new Date(task.time), allowWhileIdle: true },
            sound: soundFile,
            actionTypeId: 'ALARM_ACTIONS',
            extra: { taskId: task.id }
          }
        ];

        if (task.persistent) {
          notifications.push({
            id: baseId + 2,
            title: '🚨 NHẮC LẠI LẦN 2: ' + task.title,
            body: 'Bạn vẫn chưa xác nhận hoàn thành việc này!',
            schedule: { at: new Date(task.time + 20000), allowWhileIdle: true },
            sound: soundFile,
            actionTypeId: 'ALARM_ACTIONS',
            extra: { taskId: task.id }
          });
          notifications.push({
            id: baseId + 3,
            title: '🚨 KHẨN CẤP LẦN 3: ' + task.title,
            body: 'Đến giờ thực hiện ngay!',
            schedule: { at: new Date(task.time + 40000), allowWhileIdle: true },
            sound: soundFile,
            actionTypeId: 'ALARM_ACTIONS',
            extra: { taskId: task.id }
          });
        }

        await LocalNotifications.schedule({ notifications });
      }
    }

    async function cancelNativeNotification(taskId) {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        const baseId = getBaseNotifId(taskId);
        await LocalNotifications.cancel({
          notifications: [
            { id: baseId + 1 },
            { id: baseId + 2 },
            { id: baseId + 3 }
          ]
        });
      }
    }

    // Hủy toàn bộ thông báo đang chờ trên iOS (khi người dùng Tắt báo thức để nghỉ ngơi/họp)
    async function cancelAllScheduledNotifications() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        const pending = await LocalNotifications.getPending();
        if (pending && pending.notifications && pending.notifications.length > 0) {
          await LocalNotifications.cancel({ notifications: pending.notifications });
        }
      }
    }

    // Khôi phục lại toàn bộ lịch báo thức sắp tới khi người dùng Bật báo thức trở lại
    async function rescheduleAllUpcomingTasks() {
      if (!isMasterAlarmOn) return;
      const now = Date.now();
      for (const task of tasks) {
        if (!task.done && task.time > now) {
          await scheduleNativeNotification(task);
        }
      }
    }

    // Chức năng BẬT / TẮT Báo thức tổng thể (khi nghỉ ngơi hoặc bận họp)
    async function toggleMasterAlarm() {
      isMasterAlarmOn = !isMasterAlarmOn;
      localStorage.setItem(MASTER_ALARM_KEY, isMasterAlarmOn ? 'true' : 'false');

      if (isMasterAlarmOn) {
        await syncNotificationPermission(true);
        await rescheduleAllUpcomingTasks();
      } else {
        stopAlarmEffects();
        await cancelAllScheduledNotifications();
      }

      updateMasterAlarmUI();
      renderTasks();
    }

    function updateMasterAlarmUI() {
      const btn = document.getElementById('masterAlarmBtn');
      const dot = document.getElementById('masterAlarmDot');
      const label = document.getElementById('masterAlarmLabel');
      const banner = document.getElementById('statusBanner');
      const bannerIcon = document.getElementById('statusBannerIcon');
      const bannerText = document.getElementById('statusBannerText');

      if (isMasterAlarmOn) {
        btn.className = 'px-3.5 py-2 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/35 active:scale-95 transition flex items-center gap-1.5';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        label.textContent = 'Báo thức: BẬT';

        banner.className = 'mx-4 mt-3 px-3.5 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/25 flex items-center gap-2.5 text-xs text-amber-200/90 transition-all';
        bannerIcon.textContent = '🔊';
        bannerText.innerHTML = 'Chế độ <b>Báo thức đang BẬT</b>: Chuông đổ ầm ĩ 18 giây + rung mạnh kể cả khi tắt app (nhớ bật chuông bên hông iPhone).';
      } else {
        btn.className = 'px-3.5 py-2 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 active:scale-95 transition flex items-center gap-1.5';
        dot.className = 'w-2 h-2 rounded-full bg-slate-500';
        label.textContent = 'Báo thức: TẮT';

        banner.className = 'mx-4 mt-3 px-3.5 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center gap-2.5 text-xs text-slate-300 transition-all';
        bannerIcon.textContent = '🔕';
        bannerText.innerHTML = '<b>Đã tạm tắt báo thức</b> (Chế độ nghỉ ngơi / họp): App sẽ không đổ chuông hay làm phiền cho đến khi bạn bật lại.';
      }
    }

    async function setupNativeListeners() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;

        await LocalNotifications.registerActionTypes({
          types: [
            {
              id: 'ALARM_ACTIONS',
              actions: [
                { id: 'DONE', title: '✓ Tắt chuông & Xong' },
                { id: 'SNOOZE', title: '💤 Báo lại 5 phút' }
              ]
            }
          ]
        });

        LocalNotifications.addListener('localNotificationActionPerformed', async (event) => {
          const taskId = event.notification?.extra?.taskId;
          if (!taskId) return;
          await loadTasksFromDB();
          const task = tasks.find(t => t.id === taskId);
          if (!task) return;

          if (event.actionId === 'DONE') {
            task.done = true;
            await saveTaskToDB(task);
            await cancelNativeNotification(task.id);
            await loadTasksFromDB();
          } else if (event.actionId === 'SNOOZE') {
            await cancelNativeNotification(task.id);
            task.time = Date.now() + 5 * 60000;
            task.notified = false;
            await saveTaskToDB(task);
            await scheduleNativeNotification(task);
            await loadTasksFromDB();
          } else if (isMasterAlarmOn) {
            triggerAlarmUI(task);
          }
        });
      }
    }

    async function syncNotificationPermission(showAlertIfDenied = false) {
      if (!isMasterAlarmOn) return;

      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        let status = await LocalNotifications.checkPermissions();

        if (status.display !== 'granted') {
          status = await LocalNotifications.requestPermissions();
        }

        if (status.display !== 'granted' && showAlertIfDenied) {
          alert('Bạn đang tắt quyền thông báo của NhắcNhở+ trong hệ thống. Hãy vào Cài đặt iPhone > NhắcNhở+ > Thông báo và gạt bật Cho phép thông báo.');
        }
      } else if ('Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      if (tasks.length === 0) {
        list.innerHTML = `
          <div class="text-center py-16 text-slate-500">
            <p class="text-4xl mb-3">⏰</p>
            <p class="text-sm">Chưa có báo thức nào.<br>Nhấn nút bên dưới để đặt lịch nhắc.</p>
          </div>`;
        return;
      }

      const soundLabels = {
        urgent: '🚨 Còi khẩn cấp',
        classic: '⏰ Chuông cổ điển',
        chime: '🔔 Chuông ngân',
        nature: '🐦 Chim hót'
      };

      list.innerHTML = tasks.map(t => {
        const d = new Date(t.time);
        const timeStr = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' • ' + d.toLocaleDateString('vi-VN');
        const isOverdue = !t.done && t.time < Date.now();
        const mutedBadge = !isMasterAlarmOn && !t.done ? `<span class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400">🔕 Đang tạm tắt</span>` : '';
        return `
          <div class="p-4 rounded-2xl bg-slate-900 border ${t.done ? 'border-slate-800/50 opacity-50' : (isOverdue ? 'border-rose-500/50' : 'border-slate-800')} flex items-center justify-between gap-3">
            <div class="flex items-start gap-3 flex-1 min-w-0">
              <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone(${t.id})" class="mt-1 w-5 h-5 rounded-full accent-blue-500" />
              <div class="min-w-0 flex-1">
                <p class="font-medium text-base truncate ${t.done ? 'line-through text-slate-500' : 'text-slate-100'}">${t.title}</p>
                <div class="flex items-center gap-2 mt-1 flex-wrap">
                  <span class="text-xs ${isOverdue ? 'text-rose-400 font-semibold' : 'text-cyan-400'}">${timeStr}</span>
                  <span class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300">${soundLabels[t.sound] || '⏰ Chuông'}</span>
                  ${mutedBadge}
                </div>
              </div>
            </div>
            <button onclick="removeTask(${t.id})" class="p-2 text-slate-500 hover:text-rose-400">🗑</button>
          </div>
        `;
      }).join('');
    }

    function openModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
      quickTime(1);
    }

    function closeModal() {
      if (previewAudioPlayer) {
        previewAudioPlayer.pause();
        previewAudioPlayer = null;
      }
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
    }

    function quickTime(mins) {
      const d = new Date(Date.now() + mins * 60000);
      const tzOffset = d.getTimezoneOffset() * 60000;
      document.getElementById('taskTime').value = new Date(d - tzOffset).toISOString().slice(0, 16);
    }

    async function saveTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const timeVal = document.getElementById('taskTime').value;
      const sound = document.getElementById('taskSound').value;
      const persistent = document.getElementById('taskPersistent').checked;
      if (!title || !timeVal) return alert('Vui lòng nhập nội dung và thời gian!');

      if (isMasterAlarmOn) {
        await syncNotificationPermission(false);
      }

      const newTask = {
        id: Date.now(),
        title,
        time: new Date(timeVal).getTime(),
        sound,
        persistent,
        done: false,
        notified: false
      };

      await saveTaskToDB(newTask);
      await scheduleNativeNotification(newTask);
      document.getElementById('taskTitle').value = '';
      closeModal();
      await loadTasksFromDB();
    }

    async function toggleDone(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.done = !task.done;
      await saveTaskToDB(task);
      if (task.done) {
        await cancelNativeNotification(id);
      } else {
        await scheduleNativeNotification(task);
      }
      await loadTasksFromDB();
    }

    async function removeTask(id) {
      await deleteTaskFromDB(id);
      await cancelNativeNotification(id);
      await loadTasksFromDB();
    }

    // Kiểm tra báo thức liên tục khi app đang mở trên màn hình (chỉ kêu nếu công tắc Báo thức đang BẬT)
    setInterval(async () => {
      if (!isMasterAlarmOn) return;
      const now = Date.now();
      for (const task of tasks) {
        if (!task.done && !task.notified && task.time <= now) {
          task.notified = true;
          await saveTaskToDB(task);
          triggerAlarmUI(task);
          break;
        }
      }
    }, 1000);

    function triggerAlarmUI(task) {
      if (!isMasterAlarmOn) return;
      activeAlarmTask = task;
      document.getElementById('alarmTitle').textContent = task.title;
      document.getElementById('alarmTimeText').textContent = new Date(task.time).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      const overlay = document.getElementById('alarmOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      if (alarmAudioPlayer) alarmAudioPlayer.pause();
      alarmAudioPlayer = new Audio(`sounds/${task.sound || 'urgent'}.wav`);
      alarmAudioPlayer.loop = true;
      alarmAudioPlayer.play().catch(() => {});

      if (navigator.vibrate) {
        navigator.vibrate([800, 300, 800, 300, 800]);
        vibrateInterval = setInterval(() => {
          navigator.vibrate([800, 300, 800, 300, 800]);
        }, 2800);
      }
    }

    function stopAlarmEffects() {
      if (alarmAudioPlayer) {
        alarmAudioPlayer.pause();
        alarmAudioPlayer = null;
      }
      if (vibrateInterval) {
        clearInterval(vibrateInterval);
        vibrateInterval = null;
      }
      document.getElementById('alarmOverlay').classList.add('hidden');
      document.getElementById('alarmOverlay').classList.remove('flex');
    }

    async function completeAlarmTask() {
      stopAlarmEffects();
      if (activeAlarmTask) {
        activeAlarmTask.done = true;
        await saveTaskToDB(activeAlarmTask);
        await cancelNativeNotification(activeAlarmTask.id);
        activeAlarmTask = null;
        await loadTasksFromDB();
      }
    }

    async function snoozeAlarmTask() {
      stopAlarmEffects();
      if (activeAlarmTask) {
        await cancelNativeNotification(activeAlarmTask.id);
        activeAlarmTask.time = Date.now() + 5 * 60000;
        activeAlarmTask.notified = false;
        await saveTaskToDB(activeAlarmTask);
        await scheduleNativeNotification(activeAlarmTask);
        activeAlarmTask = null;
        await loadTasksFromDB();
      }
    }

    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
    updateMasterAlarmUI();
    setupNativeListeners();
    syncNotificationPermission(false);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        syncNotificationPermission(false);
      }
    });
    loadTasksFromDB();
  </script>
</body>
</html>
