<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NhắcNhở+" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>NhắcNhở+ v1.4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    @keyframes ringShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-18deg) scale(1.08); }
      40% { transform: rotate(18deg) scale(1.08); }
      60% { transform: rotate(-12deg) scale(1.05); }
      80% { transform: rotate(12deg) scale(1.05); }
    }
    .animate-ring { animation: ringShake 0.45s infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col max-w-md mx-auto relative">

  <!-- Header -->
  <header class="px-5 pt-6 pb-4 flex items-center justify-between border-b border-slate-800/80 bg-slate-950/90 sticky top-0 z-10 backdrop-blur">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">NhắcNhở+</h1>
        <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 font-semibold border border-blue-500/30">v1.4</span>
      </div>
      <p id="todayDate" class="text-xs text-slate-400 mt-0.5"></p>
    </div>

    <!-- Công tắc Bật / Tắt Báo thức tổng thể (Mặc định luôn BẬT) -->
    <button onclick="toggleMasterAlarm()" id="masterAlarmBtn" class="px-3.5 py-2 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/35 active:scale-95 transition flex items-center gap-1.5">
      <span id="masterAlarmDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="masterAlarmLabel">Báo thức: BẬT</span>
    </button>
  </header>

  <!-- Banner trạng thái động -->
  <div id="statusBanner" class="mx-4 mt-3 px-3.5 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/25 flex items-center gap-2.5 text-xs text-amber-200/90 transition-all">
    <span id="statusBannerIcon" class="text-base">🔊</span>
    <span id="statusBannerText">Chế độ <b>Báo thức đang BẬT</b>: Chuông đổ ầm ĩ 18 giây + rung mạnh kể cả khi tắt app (nhớ bật chuông bên hông iPhone).</span>
  </div>

  <!-- Bộ lọc nhanh -->
  <div class="px-4 pt-3 flex gap-2 overflow-x-auto no-scrollbar">
    <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white transition">Tất cả</button>
    <button onclick="setFilter('repeat')" id="filter-repeat" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 transition">🔁 Lặp lại</button>
    <button onclick="setFilter('once')" id="filter-once" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 transition">1️⃣ Một lần</button>
    <button onclick="setFilter('done')" id="filter-done" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 transition">✓ Đã xong</button>
  </div>

  <!-- Danh sách công việc -->
  <main class="flex-1 px-4 py-3 pb-28 overflow-y-auto space-y-3" id="taskList">
    <!-- Render bằng JS từ IndexedDB -->
  </main>

  <!-- Nút Thêm nhanh -->
  <div class="fixed bottom-6 inset-x-0 max-w-md mx-auto px-5 z-20">
    <button onclick="openModal()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 font-semibold text-white shadow-lg shadow-blue-600/30 active:scale-95 transition flex items-center justify-center gap-2 text-base">
      <span class="text-xl leading-none">+</span> Thêm lịch báo thức mới
    </button>
  </div>

  <!-- Modal Thêm / Sửa việc -->
  <div id="addModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-30 hidden items-end sm:items-center justify-center overflow-y-auto">
    <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 border-t sm:border border-slate-800 space-y-3.5 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h2 id="modalHeading" class="text-lg font-bold">Tạo báo thức nhắc việc</h2>
        <button onclick="closeModal()" class="text-slate-400 text-2xl leading-none px-1">&times;</button>
      </div>
      <input type="hidden" id="editTaskId" value="" />

      <div>
        <label class="text-xs text-slate-400 block mb-1">Nội dung công việc</label>
        <input type="text" id="taskTitle" placeholder="VD: Họp giao ban đầu tuần, Uống thuốc..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1">Thời gian bắt đầu / Giờ báo thức</label>
        <input type="datetime-local" id="taskTime" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500" />
        <div class="flex gap-2 mt-2 overflow-x-auto pb-1">
          <button type="button" onclick="quickTime(1)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-cyan-400 whitespace-nowrap">+1 phút (Test)</button>
          <button type="button" onclick="quickTime(15)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-slate-300 whitespace-nowrap">+15 phút</button>
          <button type="button" onclick="quickTime(60)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-slate-300 whitespace-nowrap">+1 giờ</button>
        </div>
      </div>

      <!-- Chế độ Lặp lại theo ngày / theo tuần -->
      <div>
        <label class="text-xs text-slate-400 block mb-1">Chu kỳ lặp lại</label>
        <select id="taskRepeatType" onchange="onRepeatTypeChange()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
          <option value="none">1️⃣ Không lặp lại (Chỉ nhắc 1 lần)</option>
          <option value="daily">📅 Hàng ngày (Lặp lại mỗi ngày)</option>
          <option value="weekdays">💼 Thứ 2 – Thứ 6 (Ngày làm việc)</option>
          <option value="weekly">📆 Hàng tuần (Tùy chọn các thứ trong tuần)</option>
        </select>

        <!-- Bộ chọn các thứ trong tuần (Chỉ hiện khi chọn Hàng tuần) -->
        <div id="weeklyDaysBox" class="hidden mt-2.5 p-3 rounded-xl bg-slate-800/70 border border-slate-700/70">
          <p class="text-[11px] text-slate-400 mb-2">Chọn các thứ lặp lại trong tuần:</p>
          <div class="grid grid-cols-7 gap-1.5 text-center" id="weekdayButtons">
            <button type="button" data-day="1" onclick="toggleWeekdayBtn(1)" class="day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">T2</button>
            <button type="button" data-day="2" onclick="toggleWeekdayBtn(2)" class="day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">T3</button>
            <button type="button" data-day="3" onclick="toggleWeekdayBtn(3)" class="day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">T4</button>
            <button type="button" data-day="4" onclick="toggleWeekdayBtn(4)" class="day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">T5</button>
            <button type="button" data-day="5" onclick="toggleWeekdayBtn(5)" class="day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">T6</button>
            <button type="button" data-day="6" onclick="toggleWeekdayBtn(6)" class="day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">T7</button>
            <button type="button" data-day="0" onclick="toggleWeekdayBtn(0)" class="day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300">CN</button>
          </div>
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1">Nhạc chuông báo thức (Kêu ầm ĩ 18 giây)</label>
        <div class="flex gap-2">
          <select id="taskSound" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none">
            <option value="urgent">🚨 Còi báo động khẩn cấp (To nhất)</option>
            <option value="classic">⏰ Chuông báo thức cổ điển</option>
            <option value="chime">🔔 Chuông ngân vang dội</option>
            <option value="nature">🐦 Chim hót rộn ràng</option>
          </select>
          <button type="button" onclick="previewSound()" id="previewBtn" class="px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm font-medium text-amber-400 active:scale-95">
            ▶ Thử
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between bg-slate-800/60 px-3.5 py-2.5 rounded-xl border border-slate-700/60">
        <div>
          <p class="text-xs font-medium text-slate-200">Nhắc dồn dập (3 hồi liên tiếp)</p>
          <p class="text-[11px] text-slate-400">Gửi 3 chuỗi chuông cách nhau 20 giây nếu chưa tắt</p>
        </div>
        <input type="checkbox" id="taskPersistent" checked class="w-5 h-5 accent-blue-500" />
      </div>

      <button onclick="saveTask()" class="w-full py-3.5 rounded-xl bg-blue-600 font-semibold text-white active:scale-95 transition mt-1">
        Lưu lịch báo thức
      </button>
    </div>
  </div>

  <!-- Màn hình Báo thức toàn màn hình khi đến giờ -->
  <div id="alarmOverlay" class="fixed inset-0 bg-gradient-to-b from-rose-950 via-slate-950 to-slate-950 z-50 hidden flex-col items-center justify-between p-8 text-center">
    <div class="mt-12">
      <div class="w-28 h-28 rounded-full bg-rose-500/20 border-2 border-rose-400/50 flex items-center justify-center mx-auto mb-6 animate-ring shadow-2xl shadow-rose-600/30">
        <span class="text-6xl">🚨</span>
      </div>
      <p class="text-rose-400 uppercase tracking-widest text-xs font-bold mb-2">BÁO THỨC ĐẾN GIỜ</p>
      <h2 id="alarmTitle" class="text-2xl font-bold text-white px-4"></h2>
      <p id="alarmTimeText" class="text-slate-400 text-sm mt-2"></p>
      <p id="alarmRepeatBadge" class="text-xs text-cyan-300 mt-2 font-medium"></p>
    </div>

    <div class="w-full space-y-3 mb-8">
      <button onclick="completeAlarmTask()" id="alarmDoneBtn" class="w-full py-4 rounded-2xl bg-emerald-500 text-slate-950 font-bold text-lg shadow-lg shadow-emerald-500/30 active:scale-95 transition">
        ✓ Tắt chuông & Hoàn thành
      </button>
      <button onclick="snoozeAlarmTask()" class="w-full py-3.5 rounded-2xl bg-slate-800 text-slate-200 font-medium active:scale-95 transition">
        💤 Báo lại sau 5 phút
      </button>
    </div>
  </div>

  <script>
    const DB_NAME = 'NhacNhoPlusDB_v2';
    const STORE_NAME = 'tasks';
    const MASTER_ALARM_KEY = 'nhacnho_master_alarm_enabled';
    let db = null;
    let tasks = [];
    let currentFilter = 'all';
    let selectedWeekdays = []; // Mảng chứa các thứ: 0 (CN), 1 (T2) ... 6 (T7)
    let activeAlarmTask = null;
    let alarmAudioPlayer = null;
    let previewAudioPlayer = null;
    let vibrateInterval = null;

    // Mặc định của app là BẬT báo thức (true)
    let isMasterAlarmOn = localStorage.getItem(MASTER_ALARM_KEY) !== 'false';

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function loadTasksFromDB() {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = async () => {
          let loaded = req.result || [];
          let updatedAny = false;
          const now = Date.now();

          // Tự động cuốn chiếu lịch lặp lại nếu mốc cũ đã trôi qua quá 1 phút mà chưa kịp mở app
          for (const t of loaded) {
            if (!t.done && t.repeatType && t.repeatType !== 'none' && t.time < now - 60000) {
              t.time = computeNextOccurrence(t.time, t.repeatType, t.repeatDays, now);
              t.notified = false;
              await saveTaskToDB(t);
              updatedAny = true;
            }
          }

          tasks = loaded.sort((a, b) => a.time - b.time);
          if (updatedAny && isMasterAlarmOn) {
            await rescheduleAllUpcomingTasks();
          }
          renderTasks();
          resolve(tasks);
        };
      });
    }

    async function saveTaskToDB(task) {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(task);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteTaskFromDB(id) {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // ========================================================
    // TÍNH TOÁN LẦN BÁO THỨC TIẾP THEO CHO CÁC VIỆC LẶP LẠI
    // ========================================================
    function computeNextOccurrence(baseTimestamp, repeatType, repeatDays = [], afterTimestamp = Date.now()) {
      const baseDate = new Date(baseTimestamp);
      const targetHour = baseDate.getHours();
      const targetMinute = baseDate.getMinutes();

      // Bắt đầu kiểm tra từ ngày của mốc tham chiếu (hoặc hôm nay nếu mốc cũ ở quá khứ)
      let candidate = new Date(Math.max(baseTimestamp, afterTimestamp));
      candidate.setHours(targetHour, targetMinute, 0, 0);

      // Đảm bảo thời điểm tiếp theo luôn nằm ở tương lai (> afterTimestamp)
      if (candidate.getTime() <= afterTimestamp) {
        candidate.setDate(candidate.getDate() + 1);
      }

      if (repeatType === 'daily') {
        return candidate.getTime();
      }

      if (repeatType === 'weekdays') {
        // Thứ 2 (1) -> Thứ 6 (5)
        while (candidate.getDay() === 0 || candidate.getDay() === 6) {
          candidate.setDate(candidate.getDate() + 1);
        }
        return candidate.getTime();
      }

      if (repeatType === 'weekly') {
        const validDays = (repeatDays && repeatDays.length > 0) ? repeatDays : [baseDate.getDay()];
        for (let i = 0; i < 8; i++) {
          if (validDays.includes(candidate.getDay())) {
            return candidate.getTime();
          }
          candidate.setDate(candidate.getDate() + 1);
        }
      }

      return candidate.getTime();
    }

    function formatRepeatBadge(task) {
      if (!task.repeatType || task.repeatType === 'none') return '';
      if (task.repeatType === 'daily') return '🔁 Hàng ngày';
      if (task.repeatType === 'weekdays') return '🔁 Thứ 2 – Thứ 6';
      if (task.repeatType === 'weekly') {
        const dayNames = { 1: 'T2', 2: 'T3', 3: 'T4', 4: 'T5', 5: 'T6', 6: 'T7', 0: 'CN' };
        const order = [1, 2, 3, 4, 5, 6, 0];
        const sorted = (task.repeatDays || []).slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
        if (sorted.length === 7) return '🔁 Hàng ngày';
        const labels = sorted.map(d => dayNames[d]).join(', ');
        return `🔁 Hàng tuần (${labels})`;
      }
      return '';
    }

    function previewSound() {
      const sound = document.getElementById('taskSound').value;
      const btn = document.getElementById('previewBtn');
      if (previewAudioPlayer) {
        previewAudioPlayer.pause();
        previewAudioPlayer = null;
        btn.textContent = '▶ Thử';
        return;
      }
      previewAudioPlayer = new Audio(`sounds/${sound}.wav`);
      previewAudioPlayer.play();
      btn.textContent = '⏹ Dừng';
      setTimeout(() => {
        if (previewAudioPlayer) {
          previewAudioPlayer.pause();
          previewAudioPlayer = null;
          btn.textContent = '▶ Thử';
        }
      }, 4000);
    }

    function getBaseNotifId(taskId) {
      return Math.floor((taskId % 100000000) * 10);
    }

    // Lên lịch thông báo Native iOS (hỗ trợ cả chu kỳ lặp lại trên iOS & nhắc dồn dập)
    async function scheduleNativeNotification(task) {
      if (!isMasterAlarmOn || task.done) return;

      // Nếu là việc lặp lại và giờ chọn đã qua trong ngày hôm nay, tự động đẩy sang lần kế tiếp
      if (task.repeatType && task.repeatType !== 'none' && task.time <= Date.now()) {
        task.time = computeNextOccurrence(task.time, task.repeatType, task.repeatDays, Date.now());
        await saveTaskToDB(task);
      }

      if (task.time <= Date.now()) return;

      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        const baseId = getBaseNotifId(task.id);
        const soundFile = `${task.sound}.wav`;
        const repeatTag = task.repeatType && task.repeatType !== 'none' ? ` [${formatRepeatBadge(task)}]` : '';

        // Xóa lịch cũ của task này trước khi nạp mới
        await cancelNativeNotification(task.id);

        const notifications = [];

        // Đối với việc lặp lại theo tuần hoặc hàng ngày, nạp sẵn chuỗi các lần kế tiếp (tối đa 7 lần tới)
        // để kể cả người dùng không mở app trong nhiều ngày, iPhone vẫn đổ chuông đúng từng ngày/thứ!
        if (task.repeatType && task.repeatType !== 'none') {
          let cursorTime = task.time;
          for (let occ = 0; occ < 7; occ++) {
            const occId = baseId + occ;
            notifications.push({
              id: occId,
              title: '🚨 BÁO THỨC: ' + task.title,
              body: `Lịch định kỳ${repeatTag} — Nhấn để xác nhận!`,
              schedule: { at: new Date(cursorTime), allowWhileIdle: true },
              sound: soundFile,
              actionTypeId: 'ALARM_ACTIONS',
              extra: { taskId: task.id }
            });
            cursorTime = computeNextOccurrence(cursorTime, task.repeatType, task.repeatDays, cursorTime + 60000);
          }
        } else {
          // Việc 1 lần: hỗ trợ nhắc dồn dập 3 hồi liên tiếp cách nhau 20 giây
          notifications.push({
            id: baseId + 1,
            title: '🚨 BÁO THỨC: ' + task.title,
            body: 'Nhấn để mở ứng dụng và tắt chuông!',
            schedule: { at: new Date(task.time), allowWhileIdle: true },
            sound: soundFile,
            actionTypeId: 'ALARM_ACTIONS',
            extra: { taskId: task.id }
          });

          if (task.persistent) {
            notifications.push({
              id: baseId + 2,
              title: '🚨 NHẮC LẠI LẦN 2: ' + task.title,
              body: 'Bạn vẫn chưa xác nhận hoàn thành việc này!',
              schedule: { at: new Date(task.time + 20000), allowWhileIdle: true },
              sound: soundFile,
              actionTypeId: 'ALARM_ACTIONS',
              extra: { taskId: task.id }
            });
            notifications.push({
              id: baseId + 3,
              title: '🚨 KHẨN CẤP LẦN 3: ' + task.title,
              body: 'Đến giờ thực hiện ngay!',
              schedule: { at: new Date(task.time + 40000), allowWhileIdle: true },
              sound: soundFile,
              actionTypeId: 'ALARM_ACTIONS',
              extra: { taskId: task.id }
            });
          }
        }

        await LocalNotifications.schedule({ notifications });
      }
    }

    async function cancelNativeNotification(taskId) {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        const baseId = getBaseNotifId(taskId);
        const toCancel = [];
        for (let i = 0; i < 10; i++) {
          toCancel.push({ id: baseId + i });
        }
        await LocalNotifications.cancel({ notifications: toCancel });
      }
    }

    async function cancelAllScheduledNotifications() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        const pending = await LocalNotifications.getPending();
        if (pending && pending.notifications && pending.notifications.length > 0) {
          await LocalNotifications.cancel({ notifications: pending.notifications });
        }
      }
    }

    async function rescheduleAllUpcomingTasks() {
      if (!isMasterAlarmOn) return;
      for (const task of tasks) {
        if (!task.done) {
          await scheduleNativeNotification(task);
        }
      }
    }

    async function toggleMasterAlarm() {
      isMasterAlarmOn = !isMasterAlarmOn;
      localStorage.setItem(MASTER_ALARM_KEY, isMasterAlarmOn ? 'true' : 'false');

      if (isMasterAlarmOn) {
        await syncNotificationPermission(true);
        await rescheduleAllUpcomingTasks();
      } else {
        stopAlarmEffects();
        await cancelAllScheduledNotifications();
      }

      updateMasterAlarmUI();
      renderTasks();
    }

    function updateMasterAlarmUI() {
      const btn = document.getElementById('masterAlarmBtn');
      const dot = document.getElementById('masterAlarmDot');
      const label = document.getElementById('masterAlarmLabel');
      const banner = document.getElementById('statusBanner');
      const bannerIcon = document.getElementById('statusBannerIcon');
      const bannerText = document.getElementById('statusBannerText');

      if (isMasterAlarmOn) {
        btn.className = 'px-3.5 py-2 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/35 active:scale-95 transition flex items-center gap-1.5';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        label.textContent = 'Báo thức: BẬT';

        banner.className = 'mx-4 mt-3 px-3.5 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/25 flex items-center gap-2.5 text-xs text-amber-200/90 transition-all';
        bannerIcon.textContent = '🔊';
        bannerText.innerHTML = 'Chế độ <b>Báo thức đang BẬT</b>: Hỗ trợ lặp theo ngày/tuần, kêu ầm ĩ 18 giây + rung mạnh kể cả khi tắt app.';
      } else {
        btn.className = 'px-3.5 py-2 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 active:scale-95 transition flex items-center gap-1.5';
        dot.className = 'w-2 h-2 rounded-full bg-slate-500';
        label.textContent = 'Báo thức: TẮT';

        banner.className = 'mx-4 mt-3 px-3.5 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center gap-2.5 text-xs text-slate-300 transition-all';
        bannerIcon.textContent = '🔕';
        bannerText.innerHTML = '<b>Đã tạm tắt báo thức</b> (Chế độ nghỉ ngơi / họp): App sẽ không đổ chuông hay làm phiền cho đến khi bạn bật lại.';
      }
    }

    async function setupNativeListeners() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;

        await LocalNotifications.registerActionTypes({
          types: [
            {
              id: 'ALARM_ACTIONS',
              actions: [
                { id: 'DONE', title: '✓ Tắt chuông & Xong' },
                { id: 'SNOOZE', title: '💤 Báo lại 5 phút' }
              ]
            }
          ]
        });

        LocalNotifications.addListener('localNotificationActionPerformed', async (event) => {
          const taskId = event.notification?.extra?.taskId;
          if (!taskId) return;
          await loadTasksFromDB();
          const task = tasks.find(t => t.id === taskId);
          if (!task) return;

          if (event.actionId === 'DONE') {
            await handleTaskCompletedOrRolledOver(task);
          } else if (event.actionId === 'SNOOZE') {
            await cancelNativeNotification(task.id);
            const snoozeTime = Date.now() + 5 * 60000;
            // Nếu là việc lặp lại, hẹn 5 phút nữa kêu lại 1 lần rồi giữ nguyên chu kỳ
            task.time = snoozeTime;
            task.notified = false;
            await saveTaskToDB(task);
            await scheduleNativeNotification(task);
            await loadTasksFromDB();
          } else if (isMasterAlarmOn) {
            triggerAlarmUI(task);
          }
        });
      }
    }

    // Xử lý khi hoàn thành một việc: nếu lặp lại thì tự chuyển sang kỳ tiếp theo, nếu 1 lần thì đánh dấu Đã xong
    async function handleTaskCompletedOrRolledOver(task) {
      await cancelNativeNotification(task.id);
      if (task.repeatType && task.repeatType !== 'none') {
        task.time = computeNextOccurrence(task.time, task.repeatType, task.repeatDays, Date.now() + 60000);
        task.notified = false;
        task.done = false;
        await saveTaskToDB(task);
        await scheduleNativeNotification(task);
      } else {
        task.done = true;
        await saveTaskToDB(task);
      }
      await loadTasksFromDB();
    }

    async function syncNotificationPermission(showAlertIfDenied = false) {
      if (!isMasterAlarmOn) return;

      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        let status = await LocalNotifications.checkPermissions();

        if (status.display !== 'granted') {
          status = await LocalNotifications.requestPermissions();
        }

        if (status.display !== 'granted' && showAlertIfDenied) {
          alert('Bạn đang tắt quyền thông báo của NhắcNhở+ trong hệ thống. Hãy vào Cài đặt iPhone > NhắcNhở+ > Thông báo và gạt bật Cho phép thông báo.');
        }
      } else if ('Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'repeat', 'once', 'done'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white transition whitespace-nowrap';
        } else {
          btn.className = 'px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 transition whitespace-nowrap';
        }
      });
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      let filtered = tasks;
      if (currentFilter === 'repeat') {
        filtered = tasks.filter(t => !t.done && t.repeatType && t.repeatType !== 'none');
      } else if (currentFilter === 'once') {
        filtered = tasks.filter(t => !t.done && (!t.repeatType || t.repeatType === 'none'));
      } else if (currentFilter === 'done') {
        filtered = tasks.filter(t => t.done);
      }

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="text-center py-16 text-slate-500">
            <p class="text-4xl mb-3">⏰</p>
            <p class="text-sm">Không có lịch nhắc nào trong mục này.<br>Nhấn nút bên dưới để thêm lịch mới.</p>
          </div>`;
        return;
      }

      const soundLabels = {
        urgent: '🚨 Còi khẩn cấp',
        classic: '⏰ Chuông cổ điển',
        chime: '🔔 Chuông ngân',
        nature: '🐦 Chim hót'
      };

      list.innerHTML = filtered.map(t => {
        const d = new Date(t.time);
        const timeStr = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' • ' + d.toLocaleDateString('vi-VN');
        const isOverdue = !t.done && t.time < Date.now();
        const repeatText = formatRepeatBadge(t);
        const repeatBadge = repeatText ? `<span class="text-[11px] px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-medium">${repeatText}</span>` : '';
        const mutedBadge = !isMasterAlarmOn && !t.done ? `<span class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400">🔕 Đang tạm tắt</span>` : '';

        return `
          <div class="p-4 rounded-2xl bg-slate-900 border ${t.done ? 'border-slate-800/50 opacity-50' : (isOverdue ? 'border-rose-500/50' : 'border-slate-800')} flex items-center justify-between gap-2.5">
            <div class="flex items-start gap-3 flex-1 min-w-0">
              <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleDone(${t.id})" class="mt-1 w-5 h-5 rounded-full accent-blue-500" />
              <div class="min-w-0 flex-1" onclick="editTask(${t.id})">
                <p class="font-medium text-base truncate ${t.done ? 'line-through text-slate-500' : 'text-slate-100'}">${t.title}</p>
                <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                  <span class="text-xs ${isOverdue ? 'text-rose-400 font-semibold' : 'text-cyan-400'}">${timeStr}</span>
                  ${repeatBadge}
                  <span class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300">${soundLabels[t.sound] || '⏰ Chuông'}</span>
                  ${mutedBadge}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="editTask(${t.id})" class="p-2 text-slate-400 hover:text-blue-400" title="Sửa lịch">✏️</button>
              <button onclick="removeTask(${t.id})" class="p-2 text-slate-500 hover:text-rose-400" title="Xóa">🗑</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function onRepeatTypeChange() {
      const val = document.getElementById('taskRepeatType').value;
      const box = document.getElementById('weeklyDaysBox');
      if (val === 'weekly') {
        box.classList.remove('hidden');
        if (selectedWeekdays.length === 0) {
          // Mặc định chọn sẵn thứ của ngày đang đặt
          const timeVal = document.getElementById('taskTime').value;
          const d = timeVal ? new Date(timeVal) : new Date();
          selectedWeekdays = [d.getDay()];
        }
        syncWeekdayButtonsUI();
      } else {
        box.classList.add('hidden');
      }
    }

    function toggleWeekdayBtn(day) {
      if (selectedWeekdays.includes(day)) {
        if (selectedWeekdays.length > 1) {
          selectedWeekdays = selectedWeekdays.filter(d => d !== day);
        }
      } else {
        selectedWeekdays.push(day);
      }
      syncWeekdayButtonsUI();
    }

    function syncWeekdayButtonsUI() {
      document.querySelectorAll('.day-btn').forEach(btn => {
        const day = parseInt(btn.getAttribute('data-day'), 10);
        if (selectedWeekdays.includes(day)) {
          btn.className = 'day-btn py-2 rounded-lg text-xs font-bold bg-blue-600 text-white shadow shadow-blue-600/30 transition';
        } else {
          btn.className = 'day-btn py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300 transition';
        }
      });
    }

    function openModal() {
      document.getElementById('editTaskId').value = '';
      document.getElementById('modalHeading').textContent = 'Tạo báo thức nhắc việc';
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskRepeatType').value = 'none';
      document.getElementById('taskSound').value = 'urgent';
      document.getElementById('taskPersistent').checked = true;
      selectedWeekdays = [];
      onRepeatTypeChange();
      quickTime(1);
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      document.getElementById('editTaskId').value = task.id;
      document.getElementById('modalHeading').textContent = 'Điều chỉnh lịch nhắc';
      document.getElementById('taskTitle').value = task.title;

      const d = new Date(task.time);
      const tzOffset = d.getTimezoneOffset() * 60000;
      document.getElementById('taskTime').value = new Date(d - tzOffset).toISOString().slice(0, 16);

      document.getElementById('taskRepeatType').value = task.repeatType || 'none';
      selectedWeekdays = task.repeatDays ? [...task.repeatDays] : [];
      onRepeatTypeChange();

      document.getElementById('taskSound').value = task.sound || 'urgent';
      document.getElementById('taskPersistent').checked = task.persistent !== false;

      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function closeModal() {
      if (previewAudioPlayer) {
        previewAudioPlayer.pause();
        previewAudioPlayer = null;
      }
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
    }

    function quickTime(mins) {
      const d = new Date(Date.now() + mins * 60000);
      const tzOffset = d.getTimezoneOffset() * 60000;
      document.getElementById('taskTime').value = new Date(d - tzOffset).toISOString().slice(0, 16);
    }

    async function saveTask() {
      const editIdVal = document.getElementById('editTaskId').value;
      const title = document.getElementById('taskTitle').value.trim();
      const timeVal = document.getElementById('taskTime').value;
      const repeatType = document.getElementById('taskRepeatType').value;
      const sound = document.getElementById('taskSound').value;
      const persistent = document.getElementById('taskPersistent').checked;

      if (!title || !timeVal) return alert('Vui lòng nhập nội dung và thời gian!');
      if (repeatType === 'weekly' && selectedWeekdays.length === 0) {
        return alert('Vui lòng chọn ít nhất 1 thứ trong tuần!');
      }

      if (isMasterAlarmOn) {
        await syncNotificationPermission(false);
      }

      let chosenTime = new Date(timeVal).getTime();
      const repeatDays = repeatType === 'weekly' ? [...selectedWeekdays] : [];

      // Nếu là việc lặp lại và giờ đặt hôm nay đã trôi qua, tự động tính sang lần kế tiếp hợp lệ
      if (repeatType !== 'none' && chosenTime <= Date.now()) {
        chosenTime = computeNextOccurrence(chosenTime, repeatType, repeatDays, Date.now());
      }

      const taskObj = {
        id: editIdVal ? Number(editIdVal) : Date.now(),
        title,
        time: chosenTime,
        repeatType,
        repeatDays,
        sound,
        persistent,
        done: false,
        notified: false
      };

      await saveTaskToDB(taskObj);
      await scheduleNativeNotification(taskObj);
      document.getElementById('taskTitle').value = '';
      closeModal();
      await loadTasksFromDB();
    }

    async function toggleDone(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (!task.done) {
        await handleTaskCompletedOrRolledOver(task);
      } else {
        task.done = false;
        task.notified = false;
        await saveTaskToDB(task);
        await scheduleNativeNotification(task);
        await loadTasksFromDB();
      }
    }

    async function removeTask(id) {
      await deleteTaskFromDB(id);
      await cancelNativeNotification(id);
      await loadTasksFromDB();
    }

    // Kiểm tra báo thức liên tục khi app đang mở trên màn hình
    setInterval(async () => {
      if (!isMasterAlarmOn) return;
      const now = Date.now();
      for (const task of tasks) {
        if (!task.done && !task.notified && task.time <= now) {
          task.notified = true;
          await saveTaskToDB(task);
          triggerAlarmUI(task);
          break;
        }
      }
    }, 1000);

    function triggerAlarmUI(task) {
      if (!isMasterAlarmOn) return;
      activeAlarmTask = task;
      document.getElementById('alarmTitle').textContent = task.title;
      document.getElementById('alarmTimeText').textContent = new Date(task.time).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

      const repText = formatRepeatBadge(task);
      document.getElementById('alarmRepeatBadge').textContent = repText ? `${repText} • Sẽ tự động đặt cho lần kế tiếp` : '';
      document.getElementById('alarmDoneBtn').textContent = repText ? '✓ Tắt chuông (Hẹn kỳ sau)' : '✓ Tắt chuông & Hoàn thành';

      const overlay = document.getElementById('alarmOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      if (alarmAudioPlayer) alarmAudioPlayer.pause();
      alarmAudioPlayer = new Audio(`sounds/${task.sound || 'urgent'}.wav`);
      alarmAudioPlayer.loop = true;
      alarmAudioPlayer.play().catch(() => {});

      if (navigator.vibrate) {
        navigator.vibrate([800, 300, 800, 300, 800]);
        vibrateInterval = setInterval(() => {
          navigator.vibrate([800, 300, 800, 300, 800]);
        }, 2800);
      }
    }

    function stopAlarmEffects() {
      if (alarmAudioPlayer) {
        alarmAudioPlayer.pause();
        alarmAudioPlayer = null;
      }
      if (vibrateInterval) {
        clearInterval(vibrateInterval);
        vibrateInterval = null;
      }
      document.getElementById('alarmOverlay').classList.add('hidden');
      document.getElementById('alarmOverlay').classList.remove('flex');
    }

    async function completeAlarmTask() {
      stopAlarmEffects();
      if (activeAlarmTask) {
        const taskToFinish = activeAlarmTask;
        activeAlarmTask = null;
        await handleTaskCompletedOrRolledOver(taskToFinish);
      }
    }

    async function snoozeAlarmTask() {
      stopAlarmEffects();
      if (activeAlarmTask) {
        await cancelNativeNotification(activeAlarmTask.id);
        activeAlarmTask.time = Date.now() + 5 * 60000;
        activeAlarmTask.notified = false;
        await saveTaskToDB(activeAlarmTask);
        await scheduleNativeNotification(activeAlarmTask);
        activeAlarmTask = null;
        await loadTasksFromDB();
      }
    }

    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
    updateMasterAlarmUI();
    setupNativeListeners();
    syncNotificationPermission(false);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        syncNotificationPermission(false);
        loadTasksFromDB();
      }
    });
    loadTasksFromDB();
  </script>
</body>
</html>
